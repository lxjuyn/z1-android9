# Z1 (MT6572) GPS configuration for the MTK mnld stack.
# NTP: AOSP pools; SUPL: Google default. AGPS profiles live in
# /vendor/etc/agps_profiles_conf.xml (extracted from the original ROM).
NTP_SERVER=2.android.pool.ntp.org
NTP_SERVER=time.android.com
NTP_SERVER=time.mediatek.com
XTRA_SERVER_1=http://xtrapath1.izatcloud.net/xtra2.bin
XTRA_SERVER_2=http://xtrapath2.izatcloud.net/xtra2.bin
XTRA_SERVER_3=http://xtrapath3.izatcloud.net/xtra2.bin
SUPL_HOST=supl.google.com
SUPL_PORT=7275
SUPL_VER=0x20000
SUPL_MODE=1
SUPL_ES=0
CAPABILITIES=0x31
LPP_PROFILE=0
A_GLONASS_POS_PROTOCOL_SELECT=0
ERREST=0

# MTK specific
DEBUG_LEVEL=2
GPS_DEBUG=0
MNLD_DEBUG=0
MTK_GPS_DEBUG=0
